<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لا يوجد اتصال بالإنترنت</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8faf9;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 420px; }
    .emoji { font-size: 56px; margin-bottom: 12px; }
    h1 { color: #14532d; font-size: 20px; margin: 0 0 8px; }
    p { color: #4b5563; font-size: 14px; line-height: 1.7; margin: 0 0 20px; }
    button {
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">📡</div>
    <h1>مفيش اتصال بالإنترنت دلوقتي</h1>
    <p>
      الصفحة اللي بتحاول تفتحها لسه مانزلتش على الجهاز ده قبل كده.
      افتح الصفحات اللي محتاجها (تسليم شنطة، إضافة مستفيد) مرة واحدة وانت متصل بالنت
      عشان تتخزن، وبعدها هتشتغل حتى لو النت اتقطع.
    </p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
